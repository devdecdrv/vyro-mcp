name: Build Windows EXE

on:
  push:
    branches: [main, master]
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller mcp psutil opencv-python pyttsx3 flask flask-cors pillow pygetwindow pyautogui comtypes

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name vyro-mcp `
            --hidden-import mcp `
            --hidden-import mcp.server `
            --hidden-import mcp.server.stdio `
            --hidden-import psutil `
            --hidden-import cv2 `
            --hidden-import pyttsx3 `
            --hidden-import pyttsx3.drivers `
            --hidden-import pyttsx3.drivers.sapi5 `
            --hidden-import flask `
            --hidden-import flask_cors `
            --hidden-import PIL `
            --hidden-import PIL.ImageGrab `
            --hidden-import comtypes `
            --hidden-import comtypes.client `
            --hidden-import pygetwindow `
            --hidden-import pyautogui `
            --collect-all pyttsx3 `
            --collect-all comtypes `
            server.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-mcp-windows
          path: dist/vyro-mcp.exe

      - name: Create release and upload EXE
        run: |
          $tag = "v2.0.0"
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "vyro-mcp v2.0.0" --notes "Windows AI Control Server with GUI dashboard, screen stream, UI automation, HTTP API."
          }
          gh release upload $tag dist\vyro-mcp.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
