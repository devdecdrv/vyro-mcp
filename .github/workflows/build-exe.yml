name: Build Windows EXE

on:
  push:
    branches: [main, master]
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller mcp psutil opencv-python pyaudio pyttsx3

      - name: Build EXE
        run: |
          pyinstaller --onefile --name vyro-mcp --icon NONE `
            --hidden-import mcp `
            --hidden-import mcp.server `
            --hidden-import mcp.server.stdio `
            --hidden-import psutil `
            --hidden-import cv2 `
            --hidden-import pyaudio `
            --hidden-import pyttsx3 `
            --hidden-import pyttsx3.drivers `
            --hidden-import pyttsx3.drivers.sapi5 `
            server.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-mcp-windows
          path: dist/vyro-mcp.exe

      - name: Upload EXE to Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          gh release upload v1.0.0 dist/vyro-mcp.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get install -y portaudio19-dev espeak

      - name: Install Python deps
        run: |
          pip install pyinstaller mcp psutil opencv-python-headless pyaudio pyttsx3

      - name: Build Linux binary
        run: |
          pyinstaller --onefile --name vyro-mcp \
            --hidden-import mcp \
            --hidden-import mcp.server \
            --hidden-import mcp.server.stdio \
            --hidden-import psutil \
            --hidden-import cv2 \
            --hidden-import pyaudio \
            --hidden-import pyttsx3 \
            server.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-mcp-linux
          path: dist/vyro-mcp

      - name: Upload Linux binary to Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          gh release upload v1.0.0 dist/vyro-mcp --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
